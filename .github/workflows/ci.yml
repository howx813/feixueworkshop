# CI 护栏：push / PR 时自动跑 lint + 单测 + 隔离构建。
# 注意：不包含 predeploy 里的联网检查（AI HOT 接口、曲源抽样、HTTP 冒烟），
# 那些在 deploy 前的 test:predeploy 仍会跑。这里只挡「代码级」问题。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Isolated build (静态导出到 out/)
        run: npm run build

      - name: Verify key pages in out/
        run: |
          test -f out/index.html
          test -f out/lab/index.html
          test -f out/lab/gravity/index.html
          test -f out/changelog/index.html
          echo "out/ 关键页面齐全"
