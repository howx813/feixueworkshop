<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>雪花 logo 候选</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0a1018;color:#e8ebf2;padding:24px}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{color:#98a2b3;font-size:.875rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:20px}
  .card{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#171d26;padding:12px;text-align:center}
  .card img,.card object{width:120px;height:120px;border-radius:16px}
  .id{font-weight:700;color:#6cb8c6;margin-top:8px}
  .name{font-size:.75rem;color:#98a2b3;margin-top:4px}
</style>
</head>
<body>
  <h1>雪花 logo 候选</h1>
  <p>共 12 版。选一个字母回复（如 G）。路径：public/brand/candidates/</p>
  <div class="grid">
  <div class="card">
    <img src="./A-hex-koch-outline.svg" alt="A" width="120" height="120"/>
    <div class="id">A</div>
    <div class="name">六角Koch-线稿</div>
  </div>
<div class="card">
    <img src="./B-hex-koch-fill.svg" alt="B" width="120" height="120"/>
    <div class="id">B</div>
    <div class="name">六角Koch-填充</div>
  </div>
<div class="card">
    <img src="./C-tri-koch-classic.svg" alt="C" width="120" height="120"/>
    <div class="id">C</div>
    <div class="name">三角Koch-经典</div>
  </div>
<div class="card">
    <img src="./D-hex-koch-simple.svg" alt="D" width="120" height="120"/>
    <div class="id">D</div>
    <div class="name">六角Koch-简化(n=2)</div>
  </div>
<div class="card">
    <img src="./E-hex-koch-light.svg" alt="E" width="120" height="120"/>
    <div class="id">E</div>
    <div class="name">六角Koch-浅底</div>
  </div>
<div class="card">
    <img src="./F-crystal-branch.svg" alt="F" width="120" height="120"/>
    <div class="id">F</div>
    <div class="name">六重晶体-分枝</div>
  </div>
<div class="card">
    <img src="./G-natural-barbs.svg" alt="G" width="120" height="120"/>
    <div class="id">G</div>
    <div class="name">自然雪花-侧枝</div>
  </div>
<div class="card">
    <img src="./H-hex-koch-double.svg" alt="H" width="120" height="120"/>
    <div class="id">H</div>
    <div class="name">双层六角Koch</div>
  </div>
<div class="card">
    <img src="./I-badge-teal.svg" alt="I" width="120" height="120"/>
    <div class="id">I</div>
    <div class="name">青底白花-徽章</div>
  </div>
<div class="card">
    <img src="./J-minimal-spokes.svg" alt="J" width="120" height="120"/>
    <div class="id">J</div>
    <div class="name">极简六辐</div>
  </div>
<div class="card">
    <img src="./K-hex-koch-fine.svg" alt="K" width="120" height="120"/>
    <div class="id">K</div>
    <div class="name">六角Koch-细密(n=4)</div>
  </div>
<div class="card">
    <img src="./L-frost-invert.svg" alt="L" width="120" height="120"/>
    <div class="id">L</div>
    <div class="name">霜底深色花</div>
  </div>
  </div>
</body>
</html>
